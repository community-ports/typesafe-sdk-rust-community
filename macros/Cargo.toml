[package]
name = "typesafeai-sdk-community-macros"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Derive macros for typesafeai-sdk-community: typed choice labels, score levels, and question sets."
license = "MIT"
repository = "https://github.com/community-ports/typesafeai-sdk-rust-community"
homepage = "https://typesafe.ai"
keywords = ["typesafe", "typesafe-ai", "jev", "sdk", "derive"]
categories = ["api-bindings", "development-tools::procedural-macro-helpers"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
