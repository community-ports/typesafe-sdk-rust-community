# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`; CI runs it on every push and pull request.

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerabilities, unmaintained, unsound, yanked).
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Only permissive licenses compatible with distributing an MIT SDK. Every crate
# in the tree must match one of these expressions or the check fails.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
# Multiple versions of the same crate are allowed (warned) but not failed;
# wildcard version requirements are denied. Nothing is banned outright: the
# optional `native-tls` feature legitimately pulls in OpenSSL on Linux.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io; git dependencies and other registries are rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
