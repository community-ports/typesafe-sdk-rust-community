[package]
name = "typesafeai-sdk-community"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Community-built Rust SDK for the TypeSafe AI API (System One / Jev)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/community-ports/typesafeai-sdk-rust-community"
homepage = "https://typesafe.ai"
documentation = "https://docs.typesafe.ai/"
keywords = ["typesafe", "typesafe-ai", "jev", "sdk", "ai"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".github/", "docs/"]

[workspace]
members = ["macros"]

[features]
default = ["rustls", "derive"]
# The ChoiceLabels, ScoreLevels, and Questions derive macros.
derive = ["dep:typesafeai-sdk-community-macros"]
# TLS via rustls with the platform certificate verifier (reqwest's default).
rustls = ["reqwest/rustls"]
# TLS via the operating system's native TLS library.
native-tls = ["reqwest/native-tls"]
# A synchronous `blocking::TypeSafeClient` for non-async code.
blocking = ["reqwest/blocking"]
# The `testing` module: MockTransport, scripted responses, and record/replay cassettes.
test-util = []

[dependencies]
typesafeai-sdk-community-macros = { version = "=0.3.1", path = "macros", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tracing = "0.1"
httpdate = "1"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
httpmock = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "blocking"
required-features = ["blocking"]

[[test]]
name = "blocking"
required-features = ["blocking"]

[[test]]
name = "route_composite_mock"
required-features = ["derive", "test-util"]

[[test]]
name = "batch"
required-features = ["derive", "test-util"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
